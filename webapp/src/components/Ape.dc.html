<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ w }}" height="{{ h }}" viewBox="0 -6 80 106" fill="none" style="display: block; flex: none;">
  <rect x="16" y="76" width="18" height="14" rx="6" fill="{{ legColor }}"></rect>
  <rect x="46" y="76" width="18" height="14" rx="6" fill="{{ legColor }}"></rect>
  <path d="M8 44a32 32 0 0 1 64 0v26a12 12 0 0 1-12 12H20A12 12 0 0 1 8 70Z" fill="{{ bodyColor }}"></path>
  <path d="M8 44a32 32 0 0 1 32-32v70H20A12 12 0 0 1 8 70Z" fill="#ffffff" opacity="0.08"></path>
  <rect x="37" y="6" width="6" height="12" rx="3" fill="{{ legColor }}"></rect>
  <circle cx="40" cy="6" r="4.5" fill="{{ beaconColor }}"></circle>
  <rect x="18" y="30" width="44" height="24" rx="12" fill="{{ visorColor }}"></rect>
  <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
    <g>
      <circle cx="33" cy="42" r="3.6" fill="#1e1b4b"></circle>
      <circle cx="47" cy="42" r="3.6" fill="#1e1b4b"></circle>
    </g>
  </sc-if>
  <sc-if value="{{ isThinking }}" hint-placeholder-val="{{ false }}">
    <g>
      <circle cx="30" cy="42" r="3.2" fill="#4338ca" style="animation: ab-dot 1.05s ease-in-out infinite;"></circle>
      <circle cx="40" cy="42" r="3.2" fill="#4338ca" style="animation: ab-dot 1.05s ease-in-out 0.16s infinite;"></circle>
      <circle cx="50" cy="42" r="3.2" fill="#4338ca" style="animation: ab-dot 1.05s ease-in-out 0.32s infinite;"></circle>
    </g>
  </sc-if>
  <sc-if value="{{ isHitl }}" hint-placeholder-val="{{ false }}">
    <g>
      <rect x="38" y="35" width="4" height="10" rx="2" fill="#92400e"></rect>
      <circle cx="40" cy="49" r="2.4" fill="#92400e"></circle>
    </g>
  </sc-if>
  <sc-if value="{{ isStop }}" hint-placeholder-val="{{ false }}">
    <g stroke="#991b1b" stroke-width="3.4" stroke-linecap="round">
      <path d="M29 38l8 8M37 38l-8 8M43 38l8 8M51 38l-8 8"></path>
    </g>
  </sc-if>
  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <path d="M30 43l6 6 13-13" stroke="#065f46" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
  </sc-if>
  <sc-if value="{{ isScan }}" hint-placeholder-val="{{ false }}">
    <g>
      <rect x="18" y="30" width="44" height="24" rx="12" fill="#0f172a"></rect>
      <rect x="20" y="40" width="40" height="4" fill="#34d399" opacity="0.85" style="animation: ab-scan 1.7s ease-in-out infinite;"></rect>
    </g>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:170},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;thinking&quot;,&quot;scan&quot;,&quot;hitl&quot;,&quot;stop&quot;,&quot;done&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:32,&quot;min&quot;:16,&quot;max&quot;:220,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const APE_STATES = {
  idle:     { body: '#6366f1', leg: '#4f46e5', visor: '#dbeafe', beacon: '#34d399' },
  thinking: { body: '#6366f1', leg: '#4f46e5', visor: '#dbeafe', beacon: '#34d399' },
  scan:     { body: '#6366f1', leg: '#4f46e5', visor: '#0f172a', beacon: '#34d399' },
  hitl:     { body: '#f59e0b', leg: '#b45309', visor: '#fffbeb', beacon: '#fbbf24' },
  stop:     { body: '#ef4444', leg: '#991b1b', visor: '#fef2f2', beacon: '#fca5a5' },
  done:     { body: '#10b981', leg: '#065f46', visor: '#ecfdf5', beacon: '#6ee7b7' }
};

class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'idle';
    const c = APE_STATES[st] || APE_STATES.idle;
    const w = Number(this.props.size ?? 32);
    return {
      w, h: Math.round(w * 106 / 80),
      bodyColor: c.body, legColor: c.leg, visorColor: c.visor, beaconColor: c.beacon,
      isIdle: st === 'idle', isThinking: st === 'thinking', isHitl: st === 'hitl',
      isStop: st === 'stop', isDone: st === 'done', isScan: st === 'scan'
    };
  }
}
</script>
</body>
</html>
