  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rgba(255,255,255,.14); border-radius: 9px; background: rgba(255,255,255,.05); color: #fff; font-size: 12px; font-weight: 600;\" style-hover=\"background: rgba(255,255,255,.1);\">Открыть в графе ▸<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; align-items: start;\">\n\n              <div style=\"padding: 24px; border-radius: 16px; background: #16203a; border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 20px;\">\n                <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Граф волн · топологическая раскладка · live<\u002Fspan>\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a5b4fc;\">волна {{ waveNow }} / {{ waveTotal }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-for list=\"{{ waveRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                    <div style=\"display: flex; align-items: center; gap: 10px;\">\n                      <span style=\"padding: 4px 10px; border-radius: 7px; background: {{ row.chipBg }}; border: 1px solid {{ row.chipBorder }}; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .6px; color: {{ row.color }};\">WAVE {{ row.nn }}<\u002Fspan>\n                      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{ row.color }};\">{{ row.status }}<\u002Fspan>\n                      <span style=\"flex: 1; height: 1px; background: rgba(255,255,255,.07);\"><\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n                      <sc-for list=\"{{ row.nodes }}\" as=\"n\" hint-placeholder-count=\"2\">\n                        <div style=\"min-width: 200px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid {{ n.border }}; border-radius: 14px; background: {{ n.bg }}; text-align: left;\" style-hover=\"transform: translateY(-3px);\">\n                          <span style=\"display: flex; align-items: center; gap: 10px;\">\n                            <dc-import name=\"Ape\" state=\"{{ n.ape }}\" size=\"24\" hint-size=\"24px,32px\"><\u002Fdc-import>\n                            <span style=\"display: flex; flex-direction: column;\">\n                              <span style=\"font-size: 13px; font-weight: 600; color: #fff;\">{{ n.role }}<\u002Fspan>\n                              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: rgba(255,255,255,.45);\">{{ n.family }}<\u002Fspan>\n                            <\u002Fspan>\n                          <\u002Fspan>\n                          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ n.skillColor }};\">{{ n.skill }}<\u002Fspan>\n                          <span style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\">\n                            <button sc-camel-on-click=\"{{ n.open }}\" title=\"Детали шага\" style=\"padding: 4px 9px; border: 1px solid rgba(255,255,255,.14); border-radius: 7px; background: rgba(255,255,255,.05); color: #fff; font-size: 10px; font-weight: 600;\" style-hover=\"background: rgba(255,255,255,.1);\">детали<\u002Fbutton>\n                            <button sc-camel-on-click=\"{{ n.onMap }}\" title=\"Показать на карте процесса\" style=\"padding: 4px 9px; border: 1px solid rgba(129,140,248,.3); border-radius: 7px; background: rgba(99,102,241,.14); color: #c7d2fe; font-size: 10px; font-weight: 600;\" style-hover=\"background: rgba(99,102,241,.24);\">карта ▸<\u002Fbutton>\n                            <button sc-camel-on-click=\"{{ n.inGraph }}\" title=\"Показать узел в графе\" style=\"padding: 4px 9px; border: 1px solid rgba(255,255,255,.14); border-radius: 7px; background: rgba(255,255,255,.05); color: #fff; font-size: 10px; font-weight: 600;\" style-hover=\"background: rgba(255,255,255,.1);\">граф ▸<\u002Fbutton>\n                          <\u002Fspan>\n                          <span style=\"display: flex; align-items: center; gap: 8px;\">\n                            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,.4);\">{{ n.statusLabel }}<\u002Fspan>\n                            <sc-if value=\"{{ n.busy }}\" hint-placeholder-val=\"{{ false }}\">\n                              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 60 60\" fill=\"none\" style=\"animation: ab-spin 1s linear infinite;\"><circle cx=\"30\" cy=\"30\" r=\"24\" stroke=\"rgba(255,255,255,.14)\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"30\" cy=\"30\" r=\"24\" stroke=\"#a5b4fc\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-dasharray=\"150\" stroke-dashoffset=\"108\"><\u002Fcircle><\u002Fsvg>\n                            <\u002Fsc-if>\n                          <\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <sc-if value=\"{{ handoffActive }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.24);\">\n                    <div style=\"position: relative; width: 34px; height: 34px; flex: none; animation: ab-orbit 2.6s linear infinite;\">\n                      <span style=\"position: absolute; top: 0; left: 50%; margin-left: -4px; width: 8px; height: 8px; border-radius: 9999px; background: #818cf8;\"><\u002Fspan>\n                      <span style=\"position: absolute; bottom: 2px; left: 2px; width: 6px; height: 6px; border-radius: 9999px; background: #8b5cf6;\"><\u002Fspan>\n                      <span style=\"position: absolute; bottom: 2px; right: 2px; width: 5px; height: 5px; border-radius: 9999px; background: #34d399;\"><\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 12.5px; color: rgba(255,255,255,.7);\">Эстафета: <strong style=\"color: #fff;\">{{ handoffText }}<\u002Fstrong><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ runFinished }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding: 18px; border-radius: 14px; background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.26); display: flex; flex-direction: column; gap: 10px;\">\n                    <div style=\"display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; color: #6ee7b7;\">Синтез прогона · DoD закрыт<\u002Fdiv>\n                    <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap;\">\n                      <button sc-camel-on-click=\"{{ lineageNpv }}\" title=\"Показать происхождение числа\" style=\"display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid rgba(16,185,129,.32); border-radius: 9px; background: rgba(16,185,129,.12); color: #6ee7b7; font-size: 12.5px; font-weight: 600;\" style-hover=\"background: rgba(16,185,129,.2);\">10 находок (A/B/C/D) · откуда ▸<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ lineageRetention }}\" title=\"Показать происхождение числа\" style=\"display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid rgba(16,185,129,.32); border-radius: 9px; background: rgba(16,185,129,.12); color: #6ee7b7; font-size: 12.5px; font-weight: 600;\" style-hover=\"background: rgba(16,185,129,.2);\">Дубль контрагента по ИНН · откуда ▸<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ lineageCost }}\" title=\"Показать происхождение числа\" style=\"display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid rgba(129,140,248,.35); border-radius: 9px; background: rgba(99,102,241,.14); color: #c7d2fe; font-size: 12.5px; font-weight: 600;\" style-hover=\"background: rgba(99,102,241,.24);\">Стоимость {{ runCost }} ₽ · откуда ▸<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.72); text-wrap: pretty;\">Аудит прошёл: снимок 1С проверен детерминированно, найдено 10 расхождений (A/B/C/D) — от отсутствия себестоимости до внутригруппового оборота и дубля ИНН. Каждая находка с доказательством (документ+проводка) и нормой НК/ФСБУ; отчёт ушёл после подтверждения главбуха.<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ goPassport }}\" style=\"align-self: flex-start; padding: 9px 16px; border: 1px solid rgba(16,185,129,.35); border-radius: 10px; background: rgba(16,185,129,.14); color: #6ee7b7; font-size: 12.5px; font-weight: 600;\" style-hover=\"background: rgba(16,185,129,.22);\">Открыть паспорт конверта →<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n                <div style=\"padding: 22px; border-radius: 16px; background: #16203a; border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 14px;\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Доска · Blackboard<\u002Fspan>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: rgba(255,255,255,.35);\">{{ eventCount }} событий<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto;\">\n                    <sc-for list=\"{{ boardEvents }}\" as=\"e\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border: 1px solid {{ e.border }}; border-radius: 10px; background: {{ e.bg }}; text-align: left; animation: ab-in .3s ease-out;\" style-hover=\"border-color: rgba(255,255,255,.25);\">\n                        <span style=\"display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px;\">\n                          <span style=\"color: {{ e.kindColor }}; font-weight: 600;\">{{ e.kind }}<\u002Fspan>\n                          <span style=\"color: rgba(255,255,255,.35);\">{{ e.agent }}<\u002Fspan>\n                          <span style=\"margin-left: auto; color: rgba(255,255,255,.3);\">{{ e.time }}<\u002Fspan>\n                        <\u002Fspan>\n                        <span sc-camel-on-click=\"{{ e.focus }}\" style=\"font-size: 12px; line-height: 1.45; color: rgba(255,255,255,.72); cursor: pointer;\">{{ e.text }}<\u002Fspan>\n                        <sc-if value=\"{{ e.hasLineage }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button sc-camel-on-click=\"{{ e.lineage }}\" title=\"Откуда взялось это число\" style=\"align-self: flex-start; padding: 4px 9px; border: 1px solid rgba(16,185,129,.3); border-radius: 7px; background: rgba(16,185,129,.1); color: #6ee7b7; font-size: 10px; font-weight: 600;\" style-hover=\"background: rgba(16,185,129,.2);\">откуда число ▸<\u002Fbutton>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ boardEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding: 24px 12px; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.4);\">Доска пуста — прогон только стартовал.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"padding: 22px; border-radius: 16px; background: #16203a; border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 14px;\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Вердикт аудитора · DoD<\u002Fspan>\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ dodColor }};\">{{ dodPassed }} / {{ dodTotal }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n                    <sc-for list=\"{{ dodItems }}\" as=\"d\" hint-placeholder-count=\"4\">\n                      <div style=\"display: flex; align-items: flex-start; gap: 10px;\">\n                        <span style=\"margin-top: 1px; width: 16px; height: 16px; flex: none; border-radius: 5px; background: {{ d.bg }}; color: {{ d.fg }}; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">{{ d.mark }}<\u002Fspan>\n                        <span style=\"font-size: 12.5px; line-height: 1.45; color: {{ d.textColor }};\">{{ d.text }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ dodGap }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button sc-camel-on-click=\"{{ remediate }}\" style=\"align-self: flex-start; padding: 9px ,255,.08);\">\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Навыки<\u002Fdiv>\n      <div style=\"font-size: 13px; color: rgba(255,255,255,.65);\">{{ envSkillCount }} · семейство {{ envFamily }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Точки HITL<\u002Fdiv>\n      <div style=\"font-size: 13px; color: rgba(255,255,255,.65);\">{{ envHitlCount }} · подтверждение оператора перед внешним действием.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Резидентность<\u002Fdiv>\n      <div style=\"font-size: 13px; color: rgba(255,255,255,.65);\">{{ envEgressText }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start;\">\n              <div style=\"padding: 24px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 14px;\">\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.4);\">Flow-схема · read-only<\u002Fdiv>\n                <sc-for list=\"{{ flowNodes }}\" as=\"n\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 11px; background: rgba(15,23,42,.5); border: 1p  }}\" hint-size=\"100%,600px\"><\u002Fdc-import>\n        <\u002Fsc-if>\n\n  <sc-if value=\"{{ anyOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n    <dc-import name=\"Overlays\" ov=\"{{ mModal }}\" hint-size=\"100%,100%\"><\u002Fdc-import>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ runResultOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:85;background:rgba(8,12,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;\" sc-camel-on-click=\"{{ closeRunResult }}\">\n      <div style=\"width:100%;max-width:640px;max-height:82vh;overflow:auto;background:#0f172a;border:1px solid rgba(129,140,248,.35);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"font-size:16px;font-weight:700;color:#fff;\">Результат прогона<\u002Fspan><span style=\"font-family:JetBrains Mono,monospace;font-size:11px;color:#a5b4fc;\">{{ runData.runId }}<\u002Fspan><button sc-camel-on-click=\"{{ closeRunResult }}\" style=\"margin-left:auto;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-size:12px;\">Закрыть<\u002Fbutton><\u002Fdiv>\n        <sc-if value=\"{{ runBusy }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:16px;border-radius:12px;background:rgba(99,102,241,.1);border:1px solid rgba(129,140,248,.3);color:#c7d2fe;font-size:13px;\">Прогон выполняется на реальных данных (RouteAI, ~несколько минут). Результаты появятся здесь по завершении — можно закрыть окно, прогон продолжится.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ runData }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n            <span style=\"padding:6px 12px;border-radius:9px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#6ee7b7;font-size:12.5px;font-weight:600;\">{{ runData.verdictLabel }}<\u002Fspan>\n            <span style=\"padding:6px 12px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);font-family:JetBrains Mono,monospace;font-size:12px;\">волн {{ runData.waves }}<\u002Fspan>\n            <span style=\"padding:6px 12px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);font-family:JetBrains Mono,monospace;font-size:12px;\">автономия {{ runData.autonomy }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ runData.hasFindings }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);\"><span style=\"font-size:15px;font-weight:700;color:#fbbf24;\">{{ runData.findingsTotal }} находок<\u002Fspan><span style=\"font-family:JetBrains Mono,monospace;font-size:12px;color:rgba(255,255,255,.7);\">{{ runData.findingsLine }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-family:JetBrains Mono,monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.4);\">доска прогона (реальные шаги)<\u002Fspan>\n            <sc-for list=\"{{ runData.board }}\" as=\"b\" hint-placeholder-count=\"3\"><div style=\"padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03);font-size:12px;color:rgba(255,255,255,.7);line-height:1.4;\">{{ b.text }}<\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ runData }}\" hint-placeholder-val=\"{{ true }}\"><sc-if value=\"{{ runBusy }}\" hint-placeholder-val=\"{{ false }}\"><\u002Fsc-if><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; bottom: 28px; left: 50%; z-index: 80; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 12px; background: #1c2745; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 16px 44px rgba(0,0,0,.45); animation: ab-in .25s ease-out;\">\n      <span style=\"font-size: 13px; color: #fff;\">{{ toast.text }}<\u002Fspan>\n      <sc-if value=\"{{ toast.undo }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ undoToast }}\" style=\"padding: 6px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(255,255,255,.06); color: #c7d2fe; font-size: 12px; font-weight: 600;\" style-hover=\"background: rgba(255,255,255,.14);\">Отменить · {{ toast.left }}с<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;runs&quot;,&quot;skills&quot;,&quot;data&quot;,&quot;canvas&quot;,&quot;passport&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;simSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.25,&quot;max&quot;:3,&quot;step&quot;:0.25,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Симуляция&quot;}}\">\n(function(){ if(window.__abopFetchWrapped) return; window.__abopFetchWrapped=true; var _f=window.fetch.bind(window); window.fetch=function(url,opts){ opts=opts||{}; try{ var t=localStorage.getItem('abop.token'); if(t && typeof url==='string' && url.indexOf('/api/')===0){ var h={}; var src=opts.headers||{}; for(var k in src){ if(src.hasOwnProperty(k)) h[k]=src[k]; } if(!h.Authorization && !h.authorization) h.Authorization='Bearer '+t; opts.headers=h; } }catch(e){} return _f(url,opts); }; })(); const CHIP = {\n  read:     { label: 'read',     bg: 'rgba(99,102,241,.12)', ; arr[j] = tmp;\n      p.children = arr;\n    });\n  }\n\n  renameBlock(id, label) {\n    this.mutateTree((clone, find) => { const n = find(id); if (n) n.label = label; });\n  }\n\n  fleetTick() {\n    const st = this.state;\n    if (st.liveFrozen) return;\n    const visible = st.mapDrawer === 'live' || (st.screen === 'canvas' && st.lens === 'ops' && st.mapLayer === 'LIVE');\n    if (!visible) return;\n    let list = st.instances\n      .filter(i => i.phase !== 'out')\n      .map(i => Object.assign({}, i, {\n        phase: 'live', dur: i.dur + 2,\n        cost: Math.round((i.cost + (i.status === 'HITL' ? 0 : 0.01)) * 100) / 100\n      }));\n    const activeDeps = st.deployments.filter(d => d.status === 'актив').map(d => d.id);\n    // одна случайная строка завершается\n    const done = list.filter(i => i.dur > 26 && i.status !== 'HITL');\n    if (done.length && Math.random() < 0.5) {\n      const victim = done[0].id;\n      list = list.map(i => i.id === victim ? Object.assign({}, i, { phase: 'out', status: 'готово' }) : i);\n      setTimeout(() => {\n        this.setState(p => ({ instances: p.instances.filter(x => x.id !== victim) }));\n      }, 900);\n    }\n    // новый экземпляр по триггеру\n    const live = list.filter(i => i.phase === 'live').length;\n    if (live < 6 && Math.random() < 0.45) {\n      const cands = INST_POOL.filter(p => activeDeps.indexOf(p.dep) >= 0);\n      if (cands.length) {\n        const p = cands[Math.floor(Math.random() * cands.length)];\n        list = list.concat([Object.assign({}, p, { id: 'i' + Date.now(), dur: 0, cost: 0.01, phase: 'in' })]);\n      }\n    }\n    this.setState({ instances: list, liveBeat: (st.liveBeat || 0) + 1 });\n  }\n\n  setDeployStatus(id, status, msg) {\n    this.setState(p => ({ deployments: p.deployments.map(d => d.id === id ? Object.assign({}, d, { status }) : d) }));\n    this.showToast(msg, true);\n  }\n\n  checkPlan() {\n    if (this.state.planChecking) return;\n    const steps = [\n      { text: 'Данны ction(r){ return r.ok ? r.json() : null; }).then(function(d){\n      if (d && d.scenarios) self.setState({ userScenarios: d.scenarios });\n    }).catch(function(){});\n  }\n  saveUserScenarios() {\n    fetch('/api/me/scenarios', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ scenarios: this.state.userScenarios || {} }) }).catch(function(){});\n  }\n  // memory — ПЕР-АГЕНТ/процесс (общая): грузим/сохраняем в Postgres по scope=сценарий, не localStorage.\n  loadMemory(scope) {\n    var self = this;\n    fetch('/api/memory/' + encodeURIComponent(scope)).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){\n      if (d && d.seeded && Array.isArray(d.memory)) self.setState({ memory: d.memory });\n      else self.setState({ memory: (SEED_MEMORY[scope] || []).map(function(x){ return Object.assign({}, x); }) });\n    }).catch(function(){ self.setState({ memory: (SEED_MEMORY[scope] || []).map(function(x){ return Object.assign({}, x); }) }); });\n  }\n  saveMemory() {\n    fetch('/api/memory/' + encodeURIComponent(this.state.scenario), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ memory: this.state.memory || [] }) }).catch(function(){});\n  }\n  // Флот: развёртывания = РЕАЛЬНЫЕ агенты из agent_store (PG), не симуляция/хардкод-@хэндлы.\n  // instances (живые экземпляры) приходят из реальных прогонов в loadRuns. Триггер — '—' (нет триггер-узла).\n  loadFleet() {\n    var self = this;\n    fetch('/api/agents').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){\n      var ags = (d && d.agents) || [];\n      if (!ags.length) return;   // нет реальных агентов — оставляем сид (демо не пустеет)\n      var STAT = { deployed:'актив', tested:'актив', draft:'актив', retired:'отозван' };\n      var deps = ags.map(function(a){\n        var ca = a.created_at || '';\n        return { id: a.id, agent: a.name, version: 'v' + (a.version || 1), prev: null,\n          area: a.family || a.role || '—', trigger: '—', tIcon: '·',\n          status: STAT[a.status] || 'актив', owner: a.created_by || '—',\n          autonomy: a.autonomy_max || 'L1',\n          since: ca ? (ca.slice(8, 10) + '.' + ca.slice(5, 7)) : '—', limit: '—' };\n      });\n      self.setState({ deployments: deps });\n    }).catch(function(){});\n  }\n\n  createScenario() {\n    const all = this.allScenarios();\n    const n = Object.keys(all).filter(k => k.indexOf('own') === 0).length + 1;\n    const key = 'own' + n;\n    const label = 'Новый агент ' + n;\n    const sc = {\n      label, title: 'Сборка: ' + label, own: true,\n      nodes: [{ id: 'u1', kind: 'source', title: 'Источник данных', x: 40, y: 120, meta: 'выберите рецепт' }],\n      edges: []\n    };\n    this.setState({ userScenarios: Object.assign({}, this.state.userScenarios, { [key]: sc }) },\n      () => { this.loadScenario(key); this.saveUserScenarios(); this.showToast('Создан пустой агент «' + label + '» — добавьте блоки из палитры'); });\n  }\n\n  renameScenario(label) {\n    const key = this.state.scenario;\n    const own = (this.state.userScenarios || {})[key];\n    if (!own || !label.trim()) return;\n    this.setState({ userScenarios: Object.assign({}, this.state.userScenarios, { [key]: Object.assign({}, own, { label: label.trim(), title: 'Сборка: ' + label.trim() }) }) }, () => this.saveUserScenarios());\n  }\n\n  deleteScenario(key) {\n    const rest = Object.assign({}, this.state.userScenarios);\n    const label = (rest[key] || {}).label || 'агент';\n    delete rest[key];\n    this.setState({ userScenarios: rest }, () => { this.loadScenario('fin'); this.saveUserScenarios(); });\n    this.showToast('Агент «' + label + '» удалён из черновиков');\n  }\n\n  loadScenario(key, silent) {\n    const sc = this.allScenarios()[key];\n    if (!sc) return;\n    var self = this;\n    var edges = sc.edges.map(e => Object.assign({}, e));\n    var baseNodes = sc.nodes.map(n => Object.assign({}, n));\n    var L = this.layoutFlow(baseNodes, edges);\n    this.setState({\n      scenario: key,\n      canvasNodes: L.nodes,\n      edges: edges,\n      surfaceW: Math.max(1560, L.w), surfaceH: Math.max(1200, L.h),\n      selectedNode: sc.nodes[0].id, linkFrom: null, issues: {},\n      checkState: 'idle', checkSteps: [], checkOk: false, checkFails: 0\n    });\n    this.touchGraph();\n    this.loadMemory(key);   // память процесса (per-агент) из Postgres, сид по сценарию\n    this.loadLayout('scenario:' + key, function(saved){ if (saved) { var byId = {}; saved.nodes.forEach(function(n){ byId[n.id] = n; }); self.setState({ canvasNodes: (self.state.canvasNodes||[]).map(function(n){ return byId[n.id] ? Object.assign({}, n, { x: byId[n.id].x, y: byId[n.id].y }) : n; }) }); } setTimeout(function(){ self.fitZoom(); }, 60); });\n    if (!silent) this.showToast('Сценарий «' + sc.label + '» собран на холсте');\n  }\n\n  addCanvasNode(kindDef, x, y) {\n    const id = 'n' + Date.now().toString(36);\n    const node = { id, kind: kindDef.kind, title: kindDef.label, family: kindDef.family || 'Аналитика', member: kindDef.member || FAMILIES['Аналитика'][0], x: Math.max(8, Math.min(x, this.state.surfaceW - 216)), y: Math.max(8, Math.min(y, this.state.surfaceH - 100)), meta: kindDef.meta || '' };\n    this.setState({ canvasNodes: this.state.canvasNodes.concat([node]), selectedNode: id, checkState: 'idle', checkSteps: [], checkOk: false, issues: {} });\n    this.touchGraph();\n    this.showToast('Блок «' + kindDef.label + '» добавлен на холст');\n  }\n\n  removeNode(id) {\n    this.setState({\n      canvasNodes: this.state.canvasNodes.filter(n => n.id !== id),\n      edges: this.state.edges.filter(e => e.from !== id && e.to !== id),\n      selectedNode: null, checkState: 'idle', checkSteps: [], checkOk: false, issues: {}\n    });\n    this.touchGraph();\n  }\n\n  removeEdge(idx) {\n    this.setState({ edges: this.state.edges.filter((_, j) => j !== idx), checkState:'idle', checkSteps:[], checkOk:false });\n    this.touchGraph(); this.showToast('Связь удалена');\n  }\n\n  setEdgeSchedule(idx, val) {\n    this.setState({ edges: this.state.edges.map((e, j) => j === idx ? Object.assign({}, e, { schedule: val }) : e) });\n    this.touchGraph();\n  }\n\n  finishLink(toId) {\n    const from = this.state.linkFrom;\n    if (!from || from === toId) { this.setState({ linkFrom: null }); return; }\n    const exists = this.state.edges.some(e => e.from === from && e.to === toId);\n    this.setState({\n      linkFrom: null,\n      edges: exists ? this.state.edges : this.state.edges.concat([{ from, to: toId, kind: this.state.linkKind }]),\n      checkState: 'idle', checkSteps: [], checkOk: false, issues: {}\n    });\n    this.touchGraph();\n    if (!exists) this.showToast('Связь добавлена');\n  }\n\n  startDrag(id, e) {\n    if (e.target && e.target.tagName === 'BUTTON') return;\n    const node = this.state.canvasNodes.find(n => n.id === id);\n    if (!node) return;\n    const r = this.canvasRect();\n    const zk = this.state.zoom || 1;\n    this.dragging = { id, dx: (e.clientX - r.left) / zk - node.x, dy: (e.clientY - r.top) / zk - node.y };\n    this.setState({ selectedNode: id });\n  }\n\n  onDragMove(e) {\n    if (!this.dragging) return;\n    const r = this.canvasRect();\n    const zk = this.state.zoom || 1;\n    const maxX = Math.max(this.state.surfaceW, 2400) - 214;\n    const maxY = Math.max(this.state.surfaceH, 1800) - 96;\n    const x = Math.max(4, Math.min((e.clientX - r.left) / zk - this.dragging.dx, maxX));\n    const y = Math.max(4, Math.min((e.clientY - r.top) / zk - this.dragging.dy, maxY));\n    const id = this.dragging.id;\n    this.setState({ canvasNodes: this.state.canvasNodes.map(n => n.id === id ? Object.assign({}, n, { x, y }) : n) });\n  }\n\n  linkPath() {\n    const s = this.state;\n    const a = s.canvasNodes.find(n => n.id === s.linkFrom);\n    if (!a) return '';\n    const x1 = a.x + 208, y1 = a.y + 31;\n    return 'M' + x1 + ' ' + y1 + ' l 60 0';\n  }\n\n  applyDraft() {\n    const nodes = [\n      { id: 'd1', kind: 'doc', title: 'Входящие заявки', x: 24, y: 30, meta: 'почта · 14 новых' },\n      { id: 'd2', kind: 'source', title: 'transactions_2026', x: 24, y: 190 },\n      { id: 'd3', kind: 'skill', title: 'data-query', x: 280, y: 110 },\n      { id: 'd4', kind: 'skill', title: 'dcf-valuation', x: 280, y: 300 },\n      { id: 'd5', kind: 'hitl', title: 'Подтверждение оператора', x: 540, y: 190, meta: 'оператор · dry_run' },\n      { id: 'd6', kind: 'out', title: 'Письмо заказчику', x: 540, y: 380 }\n    ];\n    this.setState({\n      drafting: false, canvasNodes: nodes, selectedNode: 'd3', issues: {}, checkState: 'idle', checkSteps: [], checkOk: false,\n      edges: [ { from: 'd1', to: 'd3' }, { from: 'd2', to: 'd4' }, { from: 'd3', to: 'd4' }, { from: 'd4', to: 'd5' }, { from: 'd5', to: 'd6' } ]\n    });\n  }\n\n  buildChecks() {\n    const s = this.state;\n    const nodes = s.canvasNodes, edges = s.edges;\n    const issues = {};\n    const out = [];\n    const push = (label, status, detail) => out.push({ label, status, detail });\n\n    // 1. компоненты объявлены и доступны\n    const unresolved = nodes.filter(n => n.kind === 'source' && /http/i.test(n.title));\n    const empty = nodes.length === 0;\n    if (empty) push('Компоненты объявлены', 'fail', 'холст пуст — нечего исполнять');\n    else if (unresolved.length) {\n      unresolved.forEach(n => { issues[n.id] = { level: 'warn', text: 'источник http: egress через прокси sLAVA, тест-прогон обязателен' }; });\n      push('Компоненты доступны', 'warn', unresolved.length + ' источник(а) требуют egress-политики');\n    } else push('Компоненты доступны', 'pass', nodes.length + ' блоков разрешены в каталоге и коннекторах');\n\n    // 2. связность\n    const isolated = nodes.filter(n => !edges.some(e => e.from === n.id || e.to === n.id));\n    if (isolated.length) {\n      isolated.forEach(n => { issues[n.id] = { level: 'fail', text: 'блок ни с чем не связан — не попадёт ни в одну волну' }; });\n      push('Связность графа', 'fail', isolated.length + ' висячих блок(ов): ' + isolated.map(n => n.title).join(', '));\n    } else if (!empty) push('Связность графа', 'pass', 'висячих блоков нет, все узлы в потоке');\n    else push('Связность графа', 'fail', 'связей нет');\n\n    // 3. вход и выход\n    const hasEntry = nodes.some(n => n.kind === 'doc' || n.kind === 'source');\n    const hasExit = nodes.some(n => n.kind === 'out' || n.kind === 'skill');\n    if (hasEntry && hasExit) push('Вход и выход объявлены', 'pass', 'есть источник данных и терминальный узел');\n    else push('Вход и выход объявлены', 'fail', !hasEntry ? 'нет входа: добавьте документ или источник' : 'нет выхода: добавьте вывод');\n\n    // 4. ацикличность (волны не допускают петель)\n    const adj = {}; nodes.forEach(n => adj[n.id] = []);\n    edges.forEach(e => { if (adj[e.from]) adj[e.from].push(e.to); });\n    let cyclic = false; const seen = {}, stack = {};\n    const dfs = (id) => {\n      if (stack[id]) { cyclic = true; return; }\n      if (seen[id]) return;\n      seen[id] = stack[id] = true;\n      (adj[id] || []).forEach(dfs);\n      stack[id] = false;\n    };\n    nodes.forEach(n => dfs(n.id));\n    push('Ацикличность (волны)', cyclic ? 'fail' : 'pass', cyclic ? 'найдена петля — оркестрация волнами не допускает циклов' : 'граф ацикличен, раскладывается в волны');\n\n    // 5. ожидания объявлены\n    const waits = nodes.filter(n => n.kind === 'wait');\n    const noTimeout = waits.filter(n => !n.meta);\n    if (!waits.length) push('Ожидания и таймауты', 'pass', 'блоков ожидания нет');\n    else if (noTimeout.length) {\n      noTimeout.forEach(n => { issues[n.id] = { level: 'warn', text: 'не задан таймаут ожидания' }; });\n      push('Ожидания и таймауты', 'warn', noTimeout.length + ' ожидание(й) без таймаута');\n    } else push('Ожидания и таймауты', 'pass', waits.map(n => n.title + ' · ' + n.meta).join(' · '));\n\n    // 6. безопасность: действие наружу прикрыто HITL\n    const actionNodes = nodes.filter(n => n.kind === 'out' || (n.kind === 'skill' && /email|ticket/i.test(n.title)));\n    const hitlBefore = (id) => {\n      const parents = edges.filter(e => e.to === id).map(e => e.from);\n      if (!parents.length) return false;\n      return parents.some(p => {\n        const pn = nodes.find(n => n.id === p);\n        return pn && (pn.kind === 'hitl' || hitlBefore(p));\n      });\n    };\n    const unguarded = actionNodes.filter(n => !hitlBefore(n.id));\n    if (!actionNodes.length) push('Действия наружу под HITL', 'pass', 'action-узлов в потоке нет');\n    else if (unguarded.length) {\n      unguarded.forEach(n => { issues[n.id] = { level: 'fail', text: 'action наружу без HITL перед ним — конверт запрещает запуск' }; });\n      push('Действия наружу под HITL', 'fail', unguarded.map(n => n.title).join(', ') + ' — добавьте блок подтверждения');\n    } else push('Действия наружу под HITL', 'pass', 'каждое внешнее действие проходит через оператора');\n\n    // 7. конверт автономии\n    push('Автономия ≤ контракт LUDA', s.rights >= 4 ? 'fail' : 'pass', s.rights >= 4 ? 'требуется L4 при потолке L3' : 'требуется L' + s.rights + ' при потолке L3');\n\n    return { steps: out, issues };\n  }\n\n  checkGraphBackend() {\n    var self=this, c=this.state.contract; if(!c||!c.audit_id) return;\n    var g={nodes:(this.state.canvasNodes||[]).filter(function(n){return n.kind==='skill';}).map(function(n){return {id:n.id,kind:'skill',skill:n.title,autonomy:c.autonomy||'A0',hitl:false};}),edges:(this.state.edges||[])};\n    fetch('/api/agents/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contract_audit_id:c.audit_id,graph:g})})\n      .then(function(r){return r.json();}).then(function(j){ self.showToast(j.ok?('Конверт бэка: пройдено · автономия '+j.autonomy_max+' ≤ '+(c.autonomy||'')+' · HITL '+j.hitl_count):('Конверт бэка: '+((j.errors||[]).length)+' наруш. — '+((j.errors||[])[0]||''))); }).catch(function(){});\n  }\n\n  runCheck() {\n    if (this.state.checkState === 'running') return; if(this.state.contract&&this.state.contract.audit_id) this.checkGraphBackend();\n    const built = this.buildChecks();\n    this.setState({ checkState: 'running', checkSteps: [], checkOk: false, checkFails: 0, issues: {} });\n    clearTimeout(this.checkTimer);\n    const step = (i) => {\n      if (i >= built.steps.length) {\n        const fails = built.steps.filter(c => c.status === 'fail').length;\n        this.setState({ checkState: 'done', checkOk: fails === 0, checkFails: fails, issues: built.issues });\n        this.showToast(fails === 0 ? 'Проверка пройдена — поток исполним' : 'Проверка нашла ' + fails + ' блокер(а)');\n        return;\n      }\n      const shown = built.steps.slice(0, i).concat([Object.assign({}, built.steps[i], { status: 'run', detail: '' })]);\n      this.setState({ checkSteps: shown });\n      this.checkTimer = setTimeout(() => {\n        this.setState({ checkSteps: built.steps.slice(0, i + 1) });\n        this.checkTimer = setTimeout(() => step(i + 1), 120);\n      }, 420);\n    };\n    step(0);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fmain><\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"</script>
