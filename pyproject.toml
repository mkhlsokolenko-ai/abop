[project]
name = "ai-product-engineer-mcp"
version = "0.1.0"
description = "Курсовой FastMCP-сервер: единая точка доступа студентов к LLM (RouteAI), RAG (Qdrant + BGE), с Keycloak-аутентификацией и cost-журналом в Postgres."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Михаил Соколенко" }]
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.9",
    "minio>=7.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ape-mcp = "server.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "portal_api"]
