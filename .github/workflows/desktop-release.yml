# Релиз ABOP Desktop в СОБСТВЕННЫЙ GitHub Releases репозитория abop (отдельно от ai-product-engineer,
# чтобы каналы обновлений двух десктопов не смешивались). Триггер — пуш тега desktop-vX.Y.Z.
#
# Собирается на ТРЁХ раннерах, потому что сайдкар — это нативный бинарь PyInstaller: кросс-сборки
# для него нет, каждая платформа и архитектура собирает себя сама.
#   windows-latest → .exe (NSIS)       — канал авто-обновления electron-updater
#   macos-14       → .dmg/.zip arm64   — Apple Silicon      (ВЫКЛЮЧЕН, см. ниже)
#   macos-15-intel → .dmg/.zip x64     — Intel-маки          (ВЫКЛЮЧЕН, см. ниже)
#
# С 22.10.2026 по решению владельца релиз идёт ТОЛЬКО под Windows: у заказчиков маков нет, а два
# раннера на каждый тег — это время сборки и деньги за платформу, которую никто не ставит.
# Маковые джобы не удалены, а выключены флагом: `workflow_dispatch` с `mac=true` собирает их как
# раньше. Удалить работу легко, вернуть дороже — и в прошлый раз именно возврат (macos-13 снят с
# обслуживания) стоил отдельного разбора.
#
# `workflow_dispatch` с publish=false прогоняет ровно ту же сборку, но складывает результат в
# артефакты и НИЧЕГО не публикует — так проверяют изменения сборки, не выпуская релиз и не трогая
# канал обновления у живых клиентов.
name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Публиковать в GitHub Releases (иначе — только артефакты сборки)"
        type: boolean
        default: false
      mac:
        description: "Собирать ещё и macOS (по умолчанию нет: владелец ведёт только Windows)"
        type: boolean
        default: false

permissions:
  contents: write        # electron-builder создаёт GitHub Release в этом же репо

env:
  # Тег публикуем всегда; ручной запуск — только если явно попросили.
  PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}
  # Маки сейчас не ведём (решение владельца 22.10.2026): два раннера на каждый релиз — это время
  # и деньги за платформу, которой у заказчиков нет. Джоб НЕ удалён: он включается одним флагом
  # ручного запуска, когда мак понадобится, — удалить работу легко, вернуть дороже.
  MAC: ${{ inputs.mac && 'yes' || 'no' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (сайдкар)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установить зависимости сайдкара + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt
          python -m pip install pyinstaller

      - name: Собрать сайдкар (PyInstaller → dist/ape-sidecar)
        run: python -m PyInstaller --noconfirm --clean build-sidecar.spec

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить npm-зависимости
        run: npm ci

      - name: Собрать инсталлятор (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # не подписываем: без winCodeSign/симлинков (см. desktop/README.md)
        run: npx electron-builder --win nsis --publish ${{ env.PUBLISH }}

      - name: Выложить артефакты (когда не публикуем)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: abop-desktop-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  mac:
    # Пропускается на теге и на обычном ручном запуске; собирается только при явном mac=true.
    if: ${{ inputs.mac }}
    strategy:
      fail-fast: false        # Intel и Apple Silicon независимы: падение одного не должно рубить второй
      matrix:
        include:
          # macos-15, а не macos-14: метку macos-14 GitHub перестал обслуживать, и джоб
          # отменялся МГНОВЕННО — без раннера, с нулевой длительностью и пустым логом (поймано
          # 12.11.2026 на релизе 1.0.36: Intel собрался, Apple Silicon нет). Это уже вторая такая
          # история после macos-13, поэтому метка проверяется глазами при каждом релизе мака.
          - runner: macos-15   # Apple Silicon
            arch: arm64
          - runner: macos-15-intel   # Intel (бывший macos-13 — снят, джоб вис в очереди навсегда)
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (сайдкар)
        uses: actions/setup-python@v5
        with:
          # 3.11, а не 3.10 как на Windows: у 3.10 нет готовых macOS-arm64 колёс для части
          # зависимостей (onnxruntime), и сборка уходила бы в компиляцию из исходников.
          python-version: "3.11"

      - name: Установить зависимости сайдкара + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt
          python -m pip install pyinstaller

      - name: Проверить архитектуру сайдкара
        # Раннер и целевая арка обязаны совпадать: PyInstaller не умеет кросс-сборку, и
        # перепутанный раннер дал бы dmg, который на машине пользователя молча не стартует.
        run: |
          test "$(uname -m)" = "$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64)" \
            || { echo "раннер ${{ matrix.runner }} ($(uname -m)) не соответствует арке ${{ matrix.arch }}"; exit 1; }

      - name: Собрать сайдкар (PyInstaller → dist/ape-sidecar)
        run: python -m PyInstaller --noconfirm --clean build-sidecar.spec

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить npm-зависимости
        run: npm ci

      - name: Отключить индексацию Spotlight на раннере
        # electron-builder собирает DMG так: монтирует образ, кладёт содержимое, отмонтирует. На
        # Intel-раннере macOS 15 отмонтирование падает с кодом 16 «resource busy» — Spotlight
        # успевает начать индексацию только что смонтированного тома и держит его. Своя уборка
        # у нас уже терпимая, но эта команда живёт ВНУТРИ electron-builder, и он после шести
        # попыток валит сборку: так ушли Intel-сборки 1.0.36 и 1.0.37, оставив авто-обновление
        # без половины пользователей. На arm64 не воспроизводится, но команда безвредна.
        run: sudo mdutil -a -i off || true

      # ZIP и DMG собираются ОТДЕЛЬНО, и это не косметика. Авто-обновление на macOS идёт через
      # ZIP: манифест `latest-mac.yml` ссылается на него, electron-updater скачивает его. DMG —
      # ручной установщик, нужный один раз при первой установке.
      #
      # Пока обе цели собирались одной командой, падение DMG уносило и ZIP: на Intel-раннере
      # `hdiutil detach -force` внутри electron-builder отдаёт код 16 «resource busy» (том держит
      # не Spotlight — его мы выключаем выше, — а что-то ещё из системных служб macOS 15), и после
      # шести его собственных попыток сборка валилась целиком. Так Intel остался без обновления в
      # 1.0.36, 1.0.37 и 1.0.38 — трижды подряд, и каждый раз причина была в ручном установщике,
      # а не в приложении.
      #
      # Поэтому: ZIP строго (упал — упал релиз), DMG отдельным шагом и БЕЗ права уронить джоб.
      # Пропущенный DMG виден в сводке джоба и не притворяется успехом.
      - name: Собрать ZIP — канал авто-обновления (electron-builder + ad-hoc подпись)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # Developer ID нет — подписываем ad-hoc в afterPack
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish ${{ env.PUBLISH }}

      - name: Собрать DMG — ручной установщик (падение не роняет релиз)
        id: dmg
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish ${{ env.PUBLISH }}

      - name: Сказать в сводку, если установщика нет
        if: steps.dmg.outcome == 'failure'
        run: |
          echo "### DMG для ${{ matrix.arch }} не собрался" >> $GITHUB_STEP_SUMMARY
          echo "Авто-обновление НЕ затронуто: оно идёт через ZIP, и ZIP собран и опубликован." >> $GITHUB_STEP_SUMMARY
          echo "Не хватает только ручного установщика для первой установки на эту арку." >> $GITHUB_STEP_SUMMARY
          echo "Обычная причина — \`hdiutil detach\` внутри electron-builder: том держит системная служба." >> $GITHUB_STEP_SUMMARY

      - name: Проверить, что подпись дожила до образа
        if: steps.dmg.outcome == 'success' 
        # Проверяем не «сборка не упала», а то, ради чего всё: распакованное из DMG приложение
        # должно иметь валидную подпись — иначе на Apple Silicon оно не запустится.
        run: |
          set -e
          dmg=$(ls dist/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /tmp/abopdmg
          codesign --verify --strict --verbose=2 "/tmp/abopdmg/ABOP Desktop.app"
          echo "--- подпись ---"; codesign -dv "/tmp/abopdmg/ABOP Desktop.app" 2>&1 | head -5
          echo "--- арка исполняемого файла ---"; file "/tmp/abopdmg/ABOP Desktop.app/Contents/MacOS/ABOP Desktop"
          echo "--- арка сайдкара ---"; file "/tmp/abopdmg/ABOP Desktop.app/Contents/Resources/ape-sidecar/ape-sidecar"
          # Отмонтирование — уборка, а не проверка: к этой строке подпись и арки уже сверены.
          # На Intel-раннере `hdiutil detach` иногда отдаёт код 16 («resource busy»), и джоб
          # краснел при полностью годных артефактах — так упал релиз 1.0.36. Пробуем дважды и
          # не роняем сборку из-за уборки.
          hdiutil detach /tmp/abopdmg -quiet || (sleep 3; hdiutil detach /tmp/abopdmg -force -quiet) || true

      # Манифест обновления каждой арки — артефактом, чтобы джоб склейки собрал из них один.
      # Без этого обе сборки пишут `latest-mac.yml` в один и тот же файл релиза, и выигрывает та,
      # что финишировала позже: авто-обновление видит ТОЛЬКО её арку. На 1.0.36 так осталась
      # только arm64, на 1.0.37 — только x64, то есть каждый релиз страдала разная половина
      # пользователей.
      - name: Выложить манифест обновления (для склейки)
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-${{ matrix.arch }}
          path: desktop/dist/latest-mac.yml
          if-no-files-found: error

      - name: Выложить артефакты (когда не публикуем)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: abop-desktop-mac-${{ matrix.arch }}
          path: desktop/dist/*.dmg
          if-no-files-found: error

  # ── Склейка манифеста обновления macOS ─────────────────────────────────────────────────────
  # electron-builder кладёт `latest-mac.yml` отдельно в каждой сборке, и в релизе остаётся
  # последний. Здесь из двух манифестов собирается один со ВСЕМИ файлами: только тогда
  # electron-updater предложит обновление и на Apple Silicon, и на Intel.
  mac-manifest:
    # `always()` обязателен: при падении одной арки обычный `needs` пропустил бы склейку целиком,
    # и в релизе остался бы манифест уцелевшей сборки — то есть ровно та поломка, которую
    # джоб и лечит. Из одного манифеста склейка соберёт один, и это честный результат.
    if: ${{ always() && inputs.mac && inputs.publish }}
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - name: Скачать манифесты арок
        uses: actions/download-artifact@v4
        with:
          pattern: mac-manifest-*
          path: manifests

      - name: Склеить в один
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import glob, yaml
          манифесты = []
          for путь in sorted(glob.glob("manifests/*/latest-mac.yml")):
              with open(путь, encoding="utf-8") as ф:
                  манифесты.append((путь, yaml.safe_load(ф)))
          if not манифесты:
              raise SystemExit("манифестов нет — склеивать нечего")
          print("нашёл манифестов:", [п for п, _ in манифесты])
          файлы, видели = [], set()
          for _, м in манифесты:
              for ф in (м.get("files") or []):
                  if ф.get("url") not in видели:
                      видели.add(ф.get("url"))
                      файлы.append(ф)
          итог = dict(манифесты[0][1])
          итог["files"] = файлы
          # Легаси-поля (`path`/`sha512`) читают только старые клиенты, а они чаще на Intel —
          # поэтому в них ставим x64-архив, если он есть.
          x64 = next((ф for ф in файлы if "x64" in str(ф.get("url")) and str(ф.get("url")).endswith(".zip")), None)
          if x64:
              итог["path"] = x64["url"]
              итог["sha512"] = x64["sha512"]
          with open("latest-mac.yml", "w", encoding="utf-8") as ф:
              yaml.safe_dump(итог, ф, allow_unicode=True, sort_keys=False)
          print(open("latest-mac.yml", encoding="utf-8").read())
          PY

      - name: Заменить манифест в релизе
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Имя переменной — ЛАТИНИЦЕЙ: bash кириллические имена не принимает и отвечает
          # «версия=1.0.37: command not found» (код 127). Поймано на этом же джобе 12.11.2026,
          # и это второй раз за день — первый был в sed на прод-сервере.
          ver=$(python -c "import yaml;print(yaml.safe_load(open('latest-mac.yml'))['version'])")
          gh release upload "v$ver" latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
          echo "манифест релиза v$ver заменён склеенным"
