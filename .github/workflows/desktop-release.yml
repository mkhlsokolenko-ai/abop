# Релиз ABOP Desktop в СОБСТВЕННЫЙ GitHub Releases репозитория abop (отдельно от ai-product-engineer,
# чтобы каналы обновлений двух десктопов не смешивались). Триггер — пуш тега desktop-vX.Y.Z.
#
# Собирается на ТРЁХ раннерах, потому что сайдкар — это нативный бинарь PyInstaller: кросс-сборки
# для него нет, каждая платформа и архитектура собирает себя сама.
#   windows-latest → .exe (NSIS)       — канал авто-обновления electron-updater
#   macos-14       → .dmg/.zip arm64   — Apple Silicon
#   macos-13       → .dmg/.zip x64     — Intel-маки
#
# `workflow_dispatch` с publish=false прогоняет ровно ту же сборку, но складывает результат в
# артефакты и НИЧЕГО не публикует — так проверяют изменения сборки, не выпуская релиз и не трогая
# канал обновления у живых клиентов.
name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Публиковать в GitHub Releases (иначе — только артефакты сборки)"
        type: boolean
        default: false

permissions:
  contents: write        # electron-builder создаёт GitHub Release в этом же репо

env:
  # Тег публикуем всегда; ручной запуск — только если явно попросили.
  PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (сайдкар)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установить зависимости сайдкара + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt
          python -m pip install pyinstaller

      - name: Собрать сайдкар (PyInstaller → dist/ape-sidecar)
        run: python -m PyInstaller --noconfirm --clean build-sidecar.spec

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить npm-зависимости
        run: npm ci

      - name: Собрать инсталлятор (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # не подписываем: без winCodeSign/симлинков (см. desktop/README.md)
        run: npx electron-builder --win nsis --publish ${{ env.PUBLISH }}

      - name: Выложить артефакты (когда не публикуем)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: abop-desktop-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  mac:
    strategy:
      fail-fast: false        # Intel и Apple Silicon независимы: падение одного не должно рубить второй
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (сайдкар)
        uses: actions/setup-python@v5
        with:
          # 3.11, а не 3.10 как на Windows: у 3.10 нет готовых macOS-arm64 колёс для части
          # зависимостей (onnxruntime), и сборка уходила бы в компиляцию из исходников.
          python-version: "3.11"

      - name: Установить зависимости сайдкара + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt
          python -m pip install pyinstaller

      - name: Проверить архитектуру сайдкара
        # Раннер и целевая арка обязаны совпадать: PyInstaller не умеет кросс-сборку, и
        # перепутанный раннер дал бы dmg, который на машине пользователя молча не стартует.
        run: |
          test "$(uname -m)" = "$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64)" \
            || { echo "раннер ${{ matrix.runner }} ($(uname -m)) не соответствует арке ${{ matrix.arch }}"; exit 1; }

      - name: Собрать сайдкар (PyInstaller → dist/ape-sidecar)
        run: python -m PyInstaller --noconfirm --clean build-sidecar.spec

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить npm-зависимости
        run: npm ci

      - name: Собрать DMG и ZIP (electron-builder + ad-hoc подпись из build/afterPack.js)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # Developer ID нет — подписываем ad-hoc в afterPack
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish ${{ env.PUBLISH }}

      - name: Проверить, что подпись дожила до образа
        # Проверяем не «сборка не упала», а то, ради чего всё: распакованное из DMG приложение
        # должно иметь валидную подпись — иначе на Apple Silicon оно не запустится.
        run: |
          set -e
          dmg=$(ls dist/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /tmp/abopdmg
          codesign --verify --strict --verbose=2 "/tmp/abopdmg/ABOP Desktop.app"
          echo "--- подпись ---"; codesign -dv "/tmp/abopdmg/ABOP Desktop.app" 2>&1 | head -5
          echo "--- арка исполняемого файла ---"; file "/tmp/abopdmg/ABOP Desktop.app/Contents/MacOS/ABOP Desktop"
          echo "--- арка сайдкара ---"; file "/tmp/abopdmg/ABOP Desktop.app/Contents/Resources/ape-sidecar/ape-sidecar"
          hdiutil detach /tmp/abopdmg -quiet

      - name: Выложить артефакты (когда не публикуем)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: abop-desktop-mac-${{ matrix.arch }}
          path: desktop/dist/*.dmg
          if-no-files-found: error
