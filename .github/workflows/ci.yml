name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke · API + бандл веба
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "psycopg[binary,pool]>=3.2" "python-dotenv>=1.0" \
            "pydantic>=2.7" "fastapi>=0.115" "uvicorn[standard]>=0.30" "pyjwt[crypto]>=2.9" \
            "minio>=7.2" "python-multipart>=0.0.9" openpyxl pypdf jsonschema pytest
      - name: веб-бандл собирается из исходников и совпадает с index.html
        run: |
          python webapp/build.py lint
          python webapp/build.py check
      - name: smoke API (in-memory, без Postgres/Keycloak)
        run: python -m pytest -q tests/test_smoke_api.py

  web-smoke:
    name: smoke · страница веба в браузере
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "psycopg[binary,pool]>=3.2" "python-dotenv>=1.0" \
            "pydantic>=2.7" "fastapi>=0.115" "uvicorn[standard]>=0.30" "pyjwt[crypto]>=2.9" \
            "minio>=7.2" "python-multipart>=0.0.9" openpyxl pypdf jsonschema playwright
          python -m playwright install --with-deps chromium
      - name: старт сервера
        run: |
          ABOP_DEV_AUTH=1 nohup python -m uvicorn server.web_api:app --host 127.0.0.1 --port 8091 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8091/api/health && break; sleep 1; done
      - name: страница рендерится (Обзор, навигация, без ошибок JS)
        run: python tests/smoke_web.py
      - name: логи сервера при падении
        if: failure()
        run: tail -100 server.log

  desktop-guard:
    name: десктоп · правки сайдкара/UI требуют версии и тега
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: версия package.json должна быть новее последнего тега, если менялся desktop/
        run: |
          LAST=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          VER=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          echo "last tag: $LAST · package.json: $VER"
          if [ -z "$LAST" ]; then echo "тегов нет — пропуск"; exit 0; fi
          CHANGED=$(git diff --name-only "$LAST"...HEAD -- desktop/sidecar desktop/electron desktop/ui desktop/package.json | wc -l)
          echo "файлов desktop/ изменено с $LAST: $CHANGED"
          if [ "$CHANGED" -gt 0 ] && [ "desktop-v$VER" = "$LAST" ]; then
            echo "::error::desktop/ изменён после $LAST, а версия в desktop/package.json не поднята ($VER). Подними версию и поставь тег desktop-v<версия> (см. docs/RELEASE_DISCIPLINE.md)"; exit 1
          fi
          if [ "$CHANGED" -gt 0 ] && ! git tag -l "desktop-v$VER" | grep -q .; then
            echo "::warning::версия $VER поднята, но тега desktop-v$VER ещё нет — релиз не собран (тег ставит владелец)"
          fi
