name: ci

on:
  push:
    branches: [main]
  pull_request:

# Несколько пушей подряд держали по раннеру каждый, а раннеров GitHub в этот день не выдавал вовсе
# («The job was not acquired by Runner of type hosted»). Устаревший прогон не нужен никому: отменяем
# его сами, чтобы очередь доставалась свежему коммиту.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke · API + бандл веба
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "psycopg[binary,pool]>=3.2" "python-dotenv>=1.0" \
            "pydantic>=2.7" "fastapi>=0.115" "uvicorn[standard]>=0.30" "pyjwt[crypto]>=2.9" \
            "minio>=7.2" "python-multipart>=0.0.9" openpyxl pypdf jsonschema pytest
      - name: веб-бандл собирается из исходников и совпадает с index.html
        run: |
          python webapp/build.py lint
          python webapp/build.py check
      - name: smoke API (in-memory, без Postgres/Keycloak)
        run: python -m pytest -q tests/test_smoke_api.py

  desktop-guard:
    name: десктоп · правки сайдкара и Electron требуют версии и тега
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Версию требуем ТОЛЬКО за то, что доезжает до человека переустановкой: сайдкар и Electron.
      # Интерфейс (`desktop/ui`) приезжает с сервера «Путём А» — требовать за него релиз значит
      # ломать сборку на каждой правке кнопки и приучать проходить мимо проверки. Ровно это и
      # произошло: пять подряд падений CI на UI-правках, которые релиза не требуют.
      - name: версия package.json новее последнего тега, если менялись сайдкар или Electron
        run: |
          LAST=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          VER=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          echo "last tag: $LAST · package.json: $VER"
          if [ -z "$LAST" ]; then echo "тегов нет — пропуск"; exit 0; fi
          RELEASE=$(git diff --name-only "$LAST"...HEAD -- desktop/sidecar desktop/electron | wc -l)
          UIONLY=$(git diff --name-only "$LAST"...HEAD -- desktop/ui | wc -l)
          echo "релиз-гейтед файлов (сайдкар/electron): $RELEASE · файлов UI (Путь А): $UIONLY"
          if [ "$RELEASE" -gt 0 ] && [ "desktop-v$VER" = "$LAST" ]; then
            echo "::error::сайдкар или Electron изменены после $LAST, а версия в desktop/package.json не поднята ($VER). Подними версию и поставь тег desktop-v<версия> (см. docs/RELEASE_DISCIPLINE.md)"; exit 1
          fi
          if [ "$RELEASE" -gt 0 ] && ! git tag -l "desktop-v$VER" | grep -q .; then
            echo "::warning::версия $VER поднята, но тега desktop-v$VER ещё нет — релиз не собран (тег ставит владелец)"
          fi
          if [ "$RELEASE" -eq 0 ] && [ "$UIONLY" -gt 0 ]; then
            echo "правки только в UI — едут Путём А, релиз не нужен"
          fi
