# Grafana auto-provisioning: источник данных Prometheus (метрики ABOP /metrics).
apiVersion: 1
# Удаление перед созданием — чтобы `uid` стал ИМЕННО таким, как объявлено. Провижининг не меняет
# uid у уже существующего источника: он был сгенерирован при первом запуске (разный в каждой
# установке), и панели, ссылающиеся на объявленный uid, его не нашли бы. Источник без состояния,
# пересоздание ничего не теряет.
deleteDatasources:
  - name: Prometheus
    orgId: 1
datasources:
  - name: Prometheus
    # Устойчивый uid: панели ссылаются на источник по нему, а не надеются на
    # «тот, что по умолчанию». Сгенерированный uid в каждой установке свой.
    uid: abop-prom
    type: prometheus
    access: proxy
    url: http://abop-prometheus:9090
    isDefault: true
    editable: true
