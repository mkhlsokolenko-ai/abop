# Тревоги Prometheus для ABOP.
#
# Появились после 19.10.2026: в контейнере демо-сервиса трое суток работал криптомайнер, жёг три
# ядра, и узнали о нём потому, что владелец заметил «стенд тормозит». Метрик по контейнерам в
# Prometheus не было вовсе — поэтому сначала источник (ops/container_metrics_exporter.py:
# штатный cAdvisor на этом хосте отдаёт только systemd-юниты), потом эти правила.
#
# Смысл порогов: нормальный контейнер стенда потребляет доли ядра и работает импульсами — прогон
# агента, сборка отчёта, выгрузка. Постоянная ровная нагрузка часами — это не работа, это майнер
# или зациклившийся процесс. Поэтому ловим не пик, а ДЛИТЕЛЬНОСТЬ.

groups:
  - name: аномальная нагрузка
    rules:
      - alert: КонтейнерЖжётПроцессор
        expr: sum by (name) (rate(abop_container_cpu_seconds_total[5m])) > 1.5
        for: 15m
        labels:
          severity: critical
          случай: майнер-19-10
        annotations:
          summary: "Контейнер «{{ $labels.name }}» держит {{ $value | printf \"%.1f\" }} ядра 15 минут"
          description: >-
            Пятнадцать минут ровной нагрузки больше полутора ядер. Для стенда это ненормально:
            прогоны агентов короткие и импульсные. Проверьте, что внутри:
            docker exec {{ $labels.name }} sh -c "ps -o pid,pcpu,args"; если процесса не видно —
            смотрите с хоста readlink /proc/<pid>/exe: запуск из /memfd значит вредонос.

      - alert: КонтейнерТихоЖжётЧасами
        expr: sum by (name) (rate(abop_container_cpu_seconds_total[30m])) > 0.35
        for: 2h
        labels:
          severity: warning
          случай: майнер-19-10
        annotations:
          summary: "Контейнер «{{ $labels.name }}» ровно грузит процессор два часа подряд"
          description: >-
            Треть ядра два часа без перерыва. Так выглядит аккуратный майнер, который намеренно
            не выходит за заметный порог, или зациклившийся процесс. Громкую нагрузку ловит
            КонтейнерЖжётПроцессор, эта тревога — про тихую.

      - alert: КонтейнерРаздулсяПоПамяти
        expr: abop_container_memory_bytes > 3e9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер «{{ $labels.name }}» держит {{ $value | humanize1024 }}B памяти"
          description: >-
            Полчаса больше трёх гигабайт. На стенде с восемью гигабайтами это съедает запас: при
            инциденте 19.10 заражённый контейнер занимал 2,2 ГБ, и машина уходила в своп.

      - alert: ХостПерегружен
        expr: node_load5 > 2 * count by (instance) (node_cpu_seconds_total{mode="idle"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Очередь на процессор вдвое больше числа ядер уже 15 минут"
          description: >-
            19.10 при майнере load average доходил до 101 — при такой очереди рвались ssh-сессии,
            а сервисы отвечали. Если тревога одна, без «КонтейнерЖжётПроцессор», ищите источник
            на хосте: ps -eo pcpu,etime,comm --sort=-pcpu | head.

  - name: платформа
    rules:
      - alert: ЦельМетрикНеОтвечает
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus не снимает метрики с «{{ $labels.job }}» ({{ $labels.instance }})"
          description: >-
            Десять минут цель недоступна. Пока она молчит, молчат и остальные тревоги по ней —
            то есть отсутствие тревог перестаёт что-либо значить.

      - alert: ОчередьПрогоновРастёт
        expr: abop_run_queue_depth > 20
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "В очереди прогонов {{ $value }} заданий двадцать минут"
          description: >-
            Воркеры не разбирают очередь: либо упёрлись в лимит обращений к модели
            (ABOP_RUN_LLM_CONCURRENCY), либо задания висят. Замер 19.10: при восьми
            одновременных обращениях ответ модели — 24 с, при шестнадцати — 37 с.

      - alert: МягкиеОшибкиПрогоновУчастились
        expr: increase(abop_run_soft_errors_total[1h]) > 20
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "За час {{ $value }} мягких ошибок в прогонах"
          description: >-
            Мягкая ошибка — это когда расчёт поправил ответ модели (подменил число, дополнил
            перечень, снял ложную жалобу на нехватку данных). Всплеск означает, что модель поехала
            или изменились данные: стоит посмотреть карточки прогонов.
