# Observability-стек для ABOP: Prometheus (scrape /metrics) + Grafana (дашборды).
# Запуск на сервере:  docker compose -f ops/docker-compose.observability.yml up -d
# ABOP Web API работает с --network host на :8091 → Prometheus тянет метрики через host-gateway.
# Grafana: http://<server>:3300 (admin/admin по умолчанию — сменить при первом входе).
#
# Два источника данных, и они отвечают на разные вопросы:
#   * Prometheus — как работает СИСТЕМА: глубина очереди, память, задержки;
#   * ABOP Postgres — что сделали ЛЮДИ и их агенты: прогоны, стоимость, решения (дашборд
#     «ABOP — срезы руководителя»). Нужна роль только на чтение, см. grafana/provisioning/
#     datasources/postgres.yml; пароль — в переменной GF_DS_PG_PASSWORD.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: abop-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - abop_prom_data:/prometheus
    ports:
      - "9091:9090"

  # Метрики по каждому контейнеру. Штатный cAdvisor на этом хосте отдаёт только systemd-юниты:
  # cgroup-и контейнеров он видит, но в метрики не кладёт (проверено на v0.49 и v0.52, с docker_only
  # и без). Разбираться в его внутренностях дороже, чем прочитать те же файлы cgroup v2 самим —
  # что и делает ops/container_metrics_exporter.py: стандартная библиотека, шестьдесят строк.
  container-metrics:
    image: python:3.12-slim
    container_name: abop-container-metrics
    restart: unless-stopped
    command: ["python", "-u", "/app/container_metrics_exporter.py"]
    volumes:
      - ./container_metrics_exporter.py:/app/container_metrics_exporter.py:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 96m

  # node-exporter — метрики самого хоста: загрузка, память, диск. Нужен, чтобы отличить
  # «один контейнер сошёл с ума» от «на машине кончились ресурсы».
  node-exporter:
    image: prom/node-exporter:latest
    container_name: abop-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.disable-defaults",
              "--collector.cpu", "--collector.loadavg", "--collector.meminfo",
              "--collector.filesystem", "--collector.netdev"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 128m

  grafana:
    image: grafana/grafana:latest
    container_name: abop-grafana
    restart: unless-stopped
    # Датасорс журнала прогонов ходит в Postgres хоста (`host.docker.internal:5433`). Без этой
    # строки имя в контейнере Grafana не разрешается, и панели срезов руководителя показывают
    # ошибку подключения — у Prometheus такая строка была, а у Grafana её не было.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Пароль роли только на чтение к журналу прогонов (датасорс ABOP Postgres). В репозитории
      # его нет: берётся из среды сервера. Не задан — панели срезов руководителя покажут ошибку
      # подключения, и это честнее, чем пустые графики, которые читаются как «работы не было».
      GF_DS_PG_PASSWORD: ${GF_DS_PG_PASSWORD:-}
      # Имя контейнера Postgres в сети стека: в разных установках своё, поэтому переменной.
      # Контейнер базы надо один раз подключить в эту сеть:
      #   docker network connect ops_default <контейнер-postgres>
      GF_DS_PG_HOST: ${GF_DS_PG_HOST:-host.docker.internal:5433}
    volumes:
      - abop_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # datasource Prometheus + провайдер дашбордов
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro    # JSON-дашборды ABOP (auto-load)
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

volumes:
  abop_prom_data:
  abop_grafana_data:
