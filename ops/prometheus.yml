# Prometheus scrape-конфиг для ABOP (Observability Фаза 0 + шина Блока 3).
# ABOP Web API отдаёт метрики на /metrics (формат Prometheus) — см. server/observability.py.
# Redpanda (сервер-2, admin API :9644/public_metrics) и коннектор-воркер (:9105/metrics) —
# порты открыты в DOCKER-USER только для сервера-1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Тревоги: см. alerts.yml. Появились после инцидента 19.10.2026 (майнер в контейнере жил трое
# суток незамеченным). Доставка уведомлений подключается отдельно — Alertmanager или контактная
# точка Grafana; пока канала нет, тревоги видны в Prometheus (/alerts) и в Grafana.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Метрики контейнеров: процессор и память по каждому. Без них нельзя ни увидеть майнера,
  # ни отличить «стенд тормозит» от «один контейнер съел три ядра».
  - job_name: container-metrics
    static_configs:
      - targets: ['container-metrics:9102']
        labels:
          service: container-metrics
          env: prod
          node: server-1

  # Метрики хоста: загрузка, память, диск — чтобы отличать нагрузку контейнера от общей.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter
          env: prod
          node: server-1

  - job_name: abop-webapi
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8091']
        labels:
          service: abop-webapi
          env: prod

  - job_name: redpanda
    metrics_path: /public_metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['201.51.5.24:9644']
        labels:
          service: redpanda
          env: prod
          node: server-2

  - job_name: abop-connector
    metrics_path: /metrics
    static_configs:
      - targets: ['201.51.5.24:9105']
        labels:
          service: abop-connector
          env: prod
          node: server-2
