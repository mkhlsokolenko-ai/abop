# Prometheus scrape-конфиг для ABOP (Observability Фаза 0).
# ABOP Web API отдаёт метрики на /metrics (формат Prometheus) — см. server/observability.py.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: abop-webapi
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8091']
        labels:
          service: abop-webapi
          env: prod
