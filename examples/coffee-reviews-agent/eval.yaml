# Мини-eval для агента кофейни. Грейдер — LLM-as-judge (профиль research/DeepSeek).
# Прогон: адаптируй под свой harness (Promptfoo или свой через MCP -> Postgres).
# Идея: агент должен находить РЕАЛЬНУЮ доминирующую боль и давать ВЫПОЛНИМЫЕ действия.

description: >
  Проверяем, что агент из отзывов недели вытаскивает главные боли и предлагает
  ровно 3 конкретных, выполнимых за понедельник действия.

cases:
  - name: главная боль — очереди на кассе
    input: sample_reviews.jsonl
    expect:
      # code-грейдер: структура ответа
      - type: json_valid
      - type: actions_count
        equals: 3
      # LLM-judge: содержательные критерии
      - type: llm_judge
        criterion: >
          Хотя бы одно действие адресует скорость обслуживания/очередь на кассе
          (это доминирующая боль в отзывах: >=3 упоминания).
      - type: llm_judge
        criterion: >
          Каждое действие выполнимо силами кофейни за один день (не «переделать
          концепцию»), конкретно (что именно сделать), без воды.

  - name: негатив — не выдумывать боль
    input: sample_reviews.jsonl
    expect:
      - type: llm_judge
        criterion: >
          Агент не предлагает решать проблему, которой нет в отзывах (напр.
          «расширить парковку» — про парковку никто не писал).

grader:
  profile: research      # судья на DeepSeek
  prompt_version: coffee-judge-v1
metrics:
  - actions_count_accuracy
  - pain_recall            # нашёл ли доминирующую боль
  - judge_pass_rate
