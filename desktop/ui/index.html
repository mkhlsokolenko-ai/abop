<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:*; img-src 'self' data:; font-src 'self';" />
  <title>ABOP Desktop</title>
  <link rel="stylesheet" href="core/theme.css" />
  <link rel="stylesheet" href="core/abop.css" />
</head>
<body>
  <!-- Оболочка — эталон workspace дизайнера (src/components/abop/shell.tsx), классы 1:1.
       Старые id (railNav, liveWorkSlot, panel, verChip, cmdBtn…) сохранены — wiring ядра не менялся. -->
  <div class="abop" data-theme="dark">

    <header class="hdr">
      <div class="hdr-brand">
        <span id="apeLogo"></span>
        <span class="hdr-logo">AB<b>O</b>P</span>
        <button id="brandDept" class="hdr-dept cap" title="Мой отдел — сменить" style="background:none;border:none;cursor:pointer;padding:0"></button>
        <span id="verChip" class="hdr-dept cap" style="opacity:.75"></span>
      </div>
      <button id="cmdBtn" type="button" class="btn btn-ghost btn-sm" aria-label="Палитра команд">
        Палитра <span class="kbd">Ctrl K</span>
      </button>
      <div class="hdr-spacer"></div>
      <button id="linkPill" type="button" class="hdr-pill" aria-live="polite" aria-label="Состояние связи с ABOP"
              title="Состояние связи · нажмите для подробностей">
        <span id="linkDot" class="dot dot-neutral"></span><span id="linkText">проверяю связь…</span>
      </button>
      <button id="tenantPill" type="button" class="hdr-pill" hidden aria-live="polite"
              title="Режим вендорского перехода: вы смотрите данные клиента">
        <span id="tenantText" style="color:var(--warn)"></span>
      </button>
      <span id="costPill" class="hdr-pill" title="Реальный расход (RunMetrics)">
        <span id="costVal">— ₽</span><span class="sep" aria-hidden="true"></span><span id="quotaVal">квота —</span>
      </span>
      <div id="verticalBox" style="display:flex;align-items:center;gap:8px;min-width:0"></div>
      <button id="themeBtn" class="btn btn-icon" title="Тема" aria-label="Переключить тему"></button>
      <div id="authBox" style="display:flex;align-items:center;gap:8px;min-width:0"></div>
    </header>

    <div id="updateBar" style="display:none"></div>

    <div class="abop-main">
      <nav id="rail" class="rail" aria-label="Разделы">
        <div class="rail-cap-wrap"><div class="cap">маршрут</div></div>
        <div id="railNav" style="display:flex;flex-direction:column;gap:2px;width:100%"></div>
        <div class="rail-cap-wrap"><div class="cap">быстрые</div></div>
        <div id="railQuick" style="display:flex;flex-direction:column;gap:2px;width:100%"></div>
      </nav>
      <div style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0">
        <!-- Строка живой работы: что идёт, где оно и сколько стоило. Пуста, когда ничего не идёт. -->
        <div id="liveWorkSlot" aria-live="polite"></div>
        <main id="panel" style="flex:1;display:flex;min-width:0;min-height:0"></main>
      </div>
    </div>

    <footer id="statusbar" class="statusbar" aria-live="polite"></footer>
  </div>
  <script type="module" src="core/app.js"></script>
</body>
</html>
